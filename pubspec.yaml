name: pmsss_scholarship
description: "PMSSS Scholarship Management System - A secure, role-based mobile application for digitizing the scholarship process."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  
  # State Management
  provider: ^6.1.2
  
  # Navigation
  go_router: ^14.6.2
  
  # Local Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  
  # Authentication
  local_auth: ^2.3.0
  
  # HTTP & API
  http: ^1.2.2
  
  # Charts & Analytics
  fl_chart: ^0.69.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  
  # Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/examples/
    - assets/icons/
